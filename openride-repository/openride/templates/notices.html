{% extends 'base.html' %}{% block title %}Upozornění{% endblock %}{% block content %}<div class="page-head"><span class="eyebrow">CO JE NOVÉHO</span><h1>Upozornění</h1></div><div class="notice-list">{% for item in items %}<div class="panel notice {% if not item.read_at %}unread{% endif %}"><div><strong>{{item.title}}</strong><p>{{item.body}}</p><small>{{item.created_at|date:'j. n. Y · H:i'}}</small></div><form method="post" action="/openride/notice/{{item.pk}}/read/">{% csrf_token %}<button class="button small secondary">Otevřít</button></form></div>{% empty %}<div class="empty">Zatím žádná upozornění.</div>{% endfor %}</div>{% endblock %}
