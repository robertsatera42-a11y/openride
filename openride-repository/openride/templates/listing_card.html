<a class="ride-card" href="/openride/listing/{{item.pk}}/"><div class="card-top"><span class="tag">{% if item.direction == 'to' %}Do školy{% else %}Ze školy{% endif %}</span><span class="date">{{item.departure|date:'j. n. Y · H:i'}}</span></div><div class="route"><strong>{{item.origin_area}}</strong><div class="route-line"><i></i></div><strong>{{item.destination_area}}</strong></div><div class="card-bottom"><span>{{item.owner.get_full_name}}</span>{% if item.kind == 'ride' %}<span class="seats">{{item.available}} volná místa</span>{% else %}<span class="seats">Poptávka</span>{% endif %}</div></a>
